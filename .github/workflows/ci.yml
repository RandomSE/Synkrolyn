name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build Synkrolyn.slnx --configuration Release
      - name: Test
        run: dotnet test Synkrolyn.slnx --configuration Release --no-build
      - name: TLC if installed
        if: runner.os == 'Linux'
        run: |
          if command -v tlc >/dev/null 2>&1; then
            tlc -config tla/MC.cfg tla/Synkrolyn.tla
          else
            echo "tlc not on PATH; skipping TLA+ model check"
          fi

  tlc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Cache tla2tools.jar
        id: tla-jar
        uses: actions/cache@v4
        with:
          path: spec/tla2tools.jar
          key: tla2tools-1.8.0-5bd7b64d
      - name: Download tla2tools.jar
        if: steps.tla-jar.outputs.cache-hit != 'true'
        run: |
          mkdir -p spec
          curl -fsSL -o spec/tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
      - name: Verify tla2tools checksum
        run: echo "5bd7b64db99ae4c6c35f290de5e809c0ee41af43f8699cf696099ffb6452b1e2  spec/tla2tools.jar" | sha256sum -c -
      - name: TLC real config
        run: java -jar spec/tla2tools.jar -cleanup -workers auto -config tla/MC.cfg tla/Synkrolyn.tla
      - name: TLC bug config must fail
        run: |
          set +e
          java -jar spec/tla2tools.jar -cleanup -workers auto -config tla/MCBug.cfg tla/Synkrolyn.tla > /tmp/tlc-bug.txt
          code=$?
          cat /tmp/tlc-bug.txt
          if ! grep -q "is violated" /tmp/tlc-bug.txt; then
            echo "buggy config must produce a counterexample"
            exit 1
          fi
          if [ "$code" -eq 0 ]; then
            echo "buggy config must exit non-zero"
            exit 1
          fi

  stryker:
    name: stryker (${{ matrix.name }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: raft
            config: stryker-raft.json
          - name: kv
            config: stryker-kv.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore local tools
        run: dotnet tool restore
      - name: Stryker
        run: dotnet stryker --config-file ${{ matrix.config }}
      - name: Undetected mutant gate
        run: python3 scripts/check-mutation-baseline.py mutation-baseline.json ${{ matrix.name }} StrykerOutput

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
      - name: Test
        working-directory: web
        run: npm test
      - name: Build
        working-directory: web
        run: npm run build
