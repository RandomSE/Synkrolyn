\* Figure-8 counterexample. CommitPriorTerms lets a leader commit a
\* prior-term entry by counting replicas. TLC must report a violation.
\*   java -jar spec/tla2tools.jar -cleanup -config tla/MCBug.cfg tla/Synkrolyn.tla

SPECIFICATION BugSpec

CONSTANTS
  Server = {n1, n2, n3, n4, n5}
  Nil = Nil
  MaxTerm = 5
  MaxLogLen = 2
  Majority = 3
  CommitPriorTerms = TRUE

INVARIANT TypeOK
INVARIANT ElectionSafety
INVARIANT LogMatching
INVARIANT LeaderCompleteness
INVARIANT StateMachineSafety
INVARIANT ReadLinearizability
PROPERTY LeaderAppendOnlyProperty

CHECK_DEADLOCK FALSE
