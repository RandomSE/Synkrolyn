\* Real Synkrolyn commit rule. From the repository root:
\*   java -jar spec/tla2tools.jar -cleanup -config tla/MC.cfg tla/Synkrolyn.tla

SPECIFICATION Spec

CONSTANTS
  Server = {n1, n2, n3}
  Nil = Nil
  MaxTerm = 2
  MaxLogLen = 2
  Majority = 2
  CommitPriorTerms = FALSE

INVARIANT TypeOK
INVARIANT ElectionSafety
INVARIANT LogMatching
INVARIANT LeaderCompleteness
INVARIANT StateMachineSafety
INVARIANT ReadLinearizability
PROPERTY LeaderAppendOnlyProperty
VIEW View

CHECK_DEADLOCK FALSE
