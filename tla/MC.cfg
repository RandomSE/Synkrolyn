\* TLC config for tla/Synkrolyn.tla. Small bounds so a local run can finish.
\* Command (from the repository root, if tlc is on PATH):
\*   tlc -config tla/MC.cfg tla/Synkrolyn.tla

SPECIFICATION Spec

CONSTANTS
  Server = {n1, n2, n3}
  Nil = Nil
  MaxTerm = 3
  MaxLogLen = 3
  Majority = 2

INVARIANT TypeOK
INVARIANT ElectionSafety
INVARIANT LogMatching
INVARIANT CommittedPrefixSafety
PROPERTY LeaderAppendOnlyProperty

CHECK_DEADLOCK FALSE
